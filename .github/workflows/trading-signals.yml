name: Binance Trading Signals - Debug Test

on:
  schedule:
    # Run every hour at the top of the hour
    - cron: '0 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  trading-signals-debug:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run trading signal bot with debug output
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash run_bot.sh
      
      - name: Display output file
        if: always()
        run: |
          echo "=== Trading Signal Bot Output ==="
          cat signal_bot_output.txt || echo "Output file not found"
      
      - name: Upload output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-signals-debug-output
          path: signal_bot_output.txt
          retention-days: 7
